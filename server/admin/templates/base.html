<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ePaper Dashboard Admin</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  nav { margin-bottom: 1rem; }
  nav a { margin-right: 1.5rem; text-decoration: none; color: #0066cc; font-weight: 500; }
  nav a:hover { text-decoration: underline; }
  h1 { margin-bottom: 0.25rem; }
  h2 { margin-top: 2rem; border-bottom: 1px solid #ddd; padding-bottom: 0.25rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 0.75rem; }
  th, td { border: 1px solid #ddd; padding: 0.4rem 0.75rem; text-align: left; font-size: 0.9rem; }
  th { background: #f5f5f5; font-weight: 600; }
  input, textarea, select { border: 1px solid #ccc; padding: 0.3rem 0.5rem; border-radius: 3px; font-size: 0.9rem; }
  button { padding: 0.3rem 0.85rem; cursor: pointer; border-radius: 3px; border: 1px solid #aaa; font-size: 0.9rem; }
  .btn-danger  { background: #fee; border-color: #f88; color: #900; }
  .btn-primary { background: #0066cc; border-color: #0055aa; color: white; }
  .btn-success { background: #060; border-color: #040; color: white; }
  form { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-top: 0.5rem; }
  .source-ok      { color: green; }
  .source-error   { color: red; }
  .source-pending { color: gray; }
</style>
<script>
function refetch(src, btn) {
  btn.disabled = true;
  btn.textContent = '...';
  fetch('/api/refetch/' + src, {method: 'POST'})
    .then(r => r.json())
    .then(d => { btn.textContent = d.status === 'ok' ? 'ok' : 'error'; })
    .catch(() => { btn.textContent = 'fail'; })
    .finally(() => { setTimeout(() => { btn.disabled = false; btn.textContent = 'Refetch'; }, 2000); });
}
</script>
</head>
<body>
<nav>
  <a href="/admin">&#8962; Home</a>
  <a href="/admin/quotes">Quotes</a>
  <a href="/admin/stocks">Stocks &amp; Portfolio</a>
</nav>
<hr>
{% block content %}

<h1>ePaper Dashboard</h1>
<h2>Source Status</h2>
<table>
<thead><tr><th>Source</th><th>Status</th><th></th></tr></thead>
<tbody>
{% for src, st in status.items() %}
<tr>
  <td>{{ src }}</td>
  <td class="source-{% if st == 'ok' %}ok{% elif st == 'pending' %}pending{% else %}error{% endif %}">{{ st }}</td>
  <td><button onclick="refetch('{{ src }}', this)">Refetch</button></td>
</tr>
{% endfor %}
</tbody>
</table>

<br>
<button class="btn-primary" onclick="fetch('/refresh',{method:'POST'}).then(r=>r.json()).then(d=>alert('Refreshed! ETag: '+d.etag))">
  Force Refresh Display
</button>

{% endblock %}
</body>
</html>
